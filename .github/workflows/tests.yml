name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: The command line has to work, not just import
        run: |
          graphify --version
          graphify infer examples/legacy_core_banking.sql -m /tmp/m.yaml
          grep -q "ACCTMST.OWNR_REF" /tmp/m.yaml
